# RASTA uchun nginx konfiguratsiyasi
# Joylashuv: /etc/nginx/sites-available/rasta  (keyin sites-enabled ga symlink)
# rasta.uz ni o'z domeningizga almashtiring.

server {
    listen 80;
    listen [::]:80;
    server_name rasta.uz www.rasta.uz;

    # certbot HTTPS sertifikatini o'rnatgandan keyin bu blokni
    # avtomatik ravishda HTTPS ga yo'naltirishga o'zgartiradi.

    client_max_body_size 12M;   # rasm yuklash uchun

    # Yuklangan rasmlarni nginx o'zi bersin (tezroq)
    location /uploads/ {
        alias /var/lib/rasta/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
