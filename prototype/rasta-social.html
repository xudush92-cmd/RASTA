<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RASTA — ijtimoiy marketplace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--surface:#fff;--ink:#0f1115;--muted:#8a8f98;--soft:#f1f2f4;--line:#e9ebef;
  --brand:#0c9b88;--brand-2:#12b8a2;--accent:#f5633c;
  --ring:linear-gradient(135deg,#0c9b88,#12b8a2 40%,#f5633c);
  --grad-cta:linear-gradient(135deg,#0c9b88,#f5633c);
  --success:#1f9d57;--warn:#d1893b;--danger:#e0405a;--info:#3f74d6;
  --shadow:0 12px 40px rgba(18,32,30,.1);--shadow-sm:0 4px 16px rgba(18,32,30,.07);
  --r:16px;--r-sm:11px;
}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}.muted{color:var(--muted)}
img,.ph{display:block}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:26px 12px 18px;display:flex;flex-direction:column}
.logo{font-family:"Segoe Script","Snell Roundhand",cursive;font-size:27px;font-weight:800;letter-spacing:-.5px;padding:6px 12px 30px;background:var(--grad-cta);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rail-item{display:flex;align-items:center;gap:16px;width:100%;padding:12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink);transition:.15s;position:relative}
.rail-item:hover{background:var(--soft)}
.rail-item.on{font-weight:800}
.rail-item .i{flex:0 0 24px}
.rail-item.on .i{stroke-width:2.4}
.rail-badge{position:absolute;left:26px;top:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.rail-ava{width:26px;height:26px;border-radius:50%;background:var(--grad-cta);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.rail-spacer{flex:1}
.rail-cta{margin:4px 8px 8px;padding:13px;border-radius:14px;background:linear-gradient(135deg,#0d2b28,#0c7d70);color:#fff;position:relative;overflow:hidden}
.rail-cta b{font-size:13px;display:block}.rail-cta span{font-size:11px;opacity:.8;display:block;margin:3px 0 10px}
.rail-cta button{background:#fff;color:#0b6a5f;font-weight:800;font-size:11px;padding:8px 12px;border-radius:9px}
.main{min-width:0}
/* ---------- topbar / bottomnav (mobile) ---------- */
.mtop,.mbottom{display:none}
/* ---------- feed layout ---------- */
.feedwrap{max-width:935px;margin:0 auto;display:grid;grid-template-columns:minmax(0,470px) 1fr;gap:56px;padding:26px 20px 90px}
.feedwrap.single{grid-template-columns:minmax(0,614px);justify-content:center}
.feedcol{min-width:0}
/* stories */
.stories{display:flex;gap:15px;overflow-x:auto;padding:6px 2px 20px;scrollbar-width:none}
.stories.two-row{display:grid;grid-auto-flow:column;grid-auto-columns:70px;grid-template-rows:auto auto;gap:16px 14px;align-items:start}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;width:70px;text-align:center}
.story-ring{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--ring);margin:0 auto 6px;display:grid;place-items:center}
.story-ring.seen{background:var(--line)}
.story-ring.add{background:var(--soft);display:grid;place-items:center;border:1px dashed #c8ccd2}
.story-inner{width:100%;height:100%;border-radius:50%;border:2px solid var(--surface);display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden}
.story small{font-size:11px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story .plus{color:var(--brand)}
/* post */
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.post-head{display:flex;align-items:center;gap:11px;padding:11px 13px}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 38px}
.ava.ring{padding:2px;background:var(--ring)}
.ava.ring>span{width:100%;height:100%;border-radius:50%;border:2px solid var(--surface);display:grid;place-items:center;background:var(--brand)}
.post-head b{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.post-head .sub{font-size:11px;color:var(--muted)}
.verified{display:inline-grid;place-items:center}
.verified svg{width:14px;height:14px;fill:var(--brand);stroke:#fff;stroke-width:1.5}
.post-head .more{margin-left:auto;color:var(--ink)}
.post-media{position:relative;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.post-media svg.art{width:74%;height:74%}
.badges{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:2}
.badge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:8px;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.94);color:var(--ink);backdrop-filter:blur(6px)}
.badge.store{color:var(--brand)}.badge.personal{color:#9a6512}
.badge.success{color:var(--success)}.badge.used{color:#9a6512}
.media-price{position:absolute;right:12px;bottom:12px;z-index:2;background:rgba(15,17,21,.82);color:#fff;font-weight:800;font-size:14px;padding:7px 12px;border-radius:11px;backdrop-filter:blur(6px)}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transition:.3s}.dots i.on{background:#fff;transform:scale(1.15)}
.slides{position:absolute;inset:0;z-index:1}
.slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .7s ease}
.slide.on{opacity:1}
.slide-dots{z-index:3}
.reel-dots{top:14px;bottom:auto;z-index:5}
.reel-dots i{background:rgba(255,255,255,.45)}.reel-dots i.on{background:#fff}
.pill svg.i{width:15px;height:15px;flex:none}
.feed-cats{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.cat-row{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 14px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:14px}
.cat-row::-webkit-scrollbar{display:none}
.cat-card{flex:0 0 auto;width:70px;text-align:center;color:var(--ink)}
.cat-img{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;margin:0 auto 7px;overflow:hidden;border:2px solid transparent;transition:.15s}
.cat-img svg.art{width:76%;height:76%}
.cat-card.on .cat-img{border-color:var(--brand);box-shadow:0 0 0 3px rgba(12,155,136,.14)}
.cat-card small{font-size:10px;font-weight:700;display:block;line-height:1.15}
.cat-card.on small{color:var(--brand)}
.sub-bar{margin:0 0 14px}
.sub-pill{height:32px;font-size:12px}
.sub-pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.post-actions{display:flex;align-items:center;gap:16px;padding:11px 13px 6px}
.act{color:var(--ink);transition:.12s}.act:hover{color:var(--muted)}.act.liked{color:var(--accent)}.act.liked svg{fill:var(--accent)}
.act.saved{color:var(--ink)}.act.saved svg{fill:var(--ink)}
.act.spacer{margin-left:auto}
.contact-mini{margin-left:auto;height:34px;padding:0 14px;border-radius:10px;background:var(--grad-cta);color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.post-likes{padding:2px 13px;font-size:13px;font-weight:700}
.post-cap{padding:3px 13px 4px;font-size:13px}
.post-cap b{font-weight:700}
.post-cap .ttl{color:var(--ink)}
.post-meta{padding:2px 13px}
.post-comments{padding:3px 13px;color:var(--muted);font-size:13px}
.post-time{padding:4px 13px 13px;color:var(--muted);font-size:10px;letter-spacing:.4px;text-transform:uppercase}
/* right rail */
.rrail{padding-top:10px}
.me{display:flex;align-items:center;gap:13px;margin-bottom:22px}
.me .ava{width:54px;height:54px;flex:0 0 54px;font-size:18px}
.me b{font-size:14px}.me span{font-size:13px;color:var(--muted)}
.rr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rr-head b{font-size:13px;color:var(--muted)}.rr-head button{font-size:12px;font-weight:800}
.sugg{display:flex;align-items:center;gap:12px;padding:7px 0}
.sugg .ava{width:44px;height:44px;flex:0 0 44px;font-size:15px}
.sugg b{font-size:13px;display:flex;gap:4px;align-items:center}.sugg span{font-size:11px;color:var(--muted)}
.sugg .follow{margin-left:auto;color:var(--brand);font-weight:800;font-size:12px}
.rr-foot{margin-top:22px;color:#c2c7cd;font-size:11px;line-height:1.9}

/* ---------- generic page ---------- */
.page{max-width:975px;margin:0 auto;padding:26px 20px 90px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head h1{font-size:26px;letter-spacing:-.6px}
.page-head p{color:var(--muted);margin-top:4px}
.searchbar{position:relative;margin-bottom:18px}
.searchbar .i{position:absolute;left:14px;top:12px;width:20px;height:20px;color:var(--muted)}
.searchbar input{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:0 44px;outline:0}
.searchbar input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(12,155,136,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:20px;font-weight:700;font-size:12.5px;color:#5a6169;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* explore grid */
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tile{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:4px;background:var(--soft)}
.tile.tall{grid-row:span 2;aspect-ratio:auto}
.tile svg.art{width:100%;height:100%}
.tile .tprice{position:absolute;left:8px;bottom:8px;background:rgba(15,17,21,.82);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px}
.tile .tbadge{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--brand)}
.tile .tbadge svg{width:13px;height:13px}
.tile:hover:after{content:"";position:absolute;inset:0;background:rgba(15,17,21,.12)}
/* product detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.detail-media{position:relative;background:var(--soft);display:grid;place-items:center;min-height:540px}
.detail-media svg.art{width:78%;height:78%}
.detail-info{padding:20px;display:flex;flex-direction:column}
.di-head{display:flex;align-items:center;gap:11px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.di-head b{font-size:13px;display:flex;gap:4px;align-items:center}.di-head span{font-size:11px;color:var(--muted)}
.di-head .more{margin-left:auto}
.di-body{padding:16px 0;overflow:auto;flex:1}
.di-badges{display:flex;gap:7px;margin-bottom:12px}
.di-title{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.3}
.di-price{font-size:26px;font-weight:800;margin:12px 0 6px;background:var(--grad-cta);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.di-avail{display:inline-flex;align-items:center;gap:7px;color:var(--success);font-weight:800;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.di-label{font-size:11px;font-weight:800;color:#586069;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.4px}
.variants{display:flex;gap:8px;flex-wrap:wrap}
.variant{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:11px;font-weight:700;color:#5a6169}
.variant.on{border:2px solid var(--brand);color:var(--brand);background:rgba(12,155,136,.06)}
.attrs{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.attr{display:flex;justify-content:space-between;padding:11px 13px;font-size:12px;border-bottom:1px solid var(--soft)}
.attr:last-child{border:0}.attr span{color:var(--muted)}.attr b{font-weight:700}
.di-actions{display:flex;gap:9px;padding-top:15px;border-top:1px solid var(--line)}
.btn{height:46px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn-grad{background:var(--grad-cta);color:#fff}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.di-note{margin-top:12px;padding:10px 12px;background:#fff6ea;color:#8a5a13;border-radius:11px;font-size:10.5px;display:flex;gap:7px}
.di-note svg{width:15px;height:15px;flex:0 0 15px}
.detail-back{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--brand);margin-bottom:14px}
.di-desc{font-size:13px;line-height:1.6;color:#3d444d;margin-top:2px}
.ov-desc{font-size:11.5px;line-height:1.5;opacity:.82;margin:5px 0 7px}
/* reviews / ratings */
.rating-sum{display:flex;align-items:center;gap:13px;margin:6px 0 8px}
.rating-sum .big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.rev-stars{display:inline-flex;gap:1px}
.rev-stars svg{width:14px;height:14px;fill:#f5a623;stroke:#f5a623;stroke-width:1.4}
.rev-stars svg.off{fill:none;stroke:#cbd2d8}
.reviews{margin-top:4px}
.rev{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--soft)}
.rev:last-child{border:0}
.rev .ava{width:34px;height:34px;flex:0 0 34px;font-size:13px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.rev-h{display:flex;align-items:center;gap:8px}
.rev-h b{font-size:12.5px;font-weight:700}
.rev p{font-size:12.5px;color:#3d444d;margin-top:3px;line-height:1.5}
.rev .t{font-size:10.5px;color:var(--muted);margin-top:4px}
.pf-reviews{max-width:640px;margin:0 auto;padding:18px 16px 44px}
.rel-sec{margin-top:24px}
.rel-head{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin-bottom:12px;padding:0 2px}
.rel-head svg{width:17px;height:17px;color:var(--brand);flex:none}
.rel-grid{gap:8px}.rel-grid .tile{border-radius:12px}
/* store profile */
.profile{max-width:935px;margin:0 auto}
.pf-top{display:flex;gap:36px;align-items:center;padding:16px 0 26px}
.pf-ava{width:150px;height:150px;flex:0 0 150px;border-radius:50%;padding:4px;background:var(--ring)}
.pf-ava>span{width:100%;height:100%;border-radius:50%;border:4px solid var(--surface);display:grid;place-items:center;color:#fff;font-weight:800;font-size:48px;background:var(--brand)}
.pf-meta{min-width:0}
.pf-name{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pf-name h1{font-size:22px;font-weight:600;display:flex;align-items:center;gap:7px}
.pf-name .verified svg{width:20px;height:20px}
.pf-btns{display:flex;gap:9px}
.pf-btn{height:36px;padding:0 18px;border-radius:10px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.pf-btn.follow{background:var(--grad-cta);color:#fff}
.pf-btn.line{background:var(--soft)}
.pf-stats{display:flex;gap:34px;margin:18px 0}
.pf-stats b{font-weight:800}.pf-stats span{color:var(--muted)}
.pf-bio{max-width:520px}.pf-bio b{display:block}.pf-bio p{color:#3d444d;margin-top:2px}
.pf-bio .loc{color:var(--muted);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px}
.pf-bio .loc svg{width:14px;height:14px;flex:none}
.hl-c svg{width:24px;height:24px}
.pf-highlights{display:flex;gap:20px;padding:8px 0 22px;overflow-x:auto;scrollbar-width:none}
.pf-highlights::-webkit-scrollbar{display:none}
.hl{text-align:center;flex:0 0 auto}
.hl-c{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:#4a525b;margin:0 auto 6px;background:var(--surface)}
.hl small{font-size:11px}
.pf-tabs{display:flex;justify-content:center;gap:52px;border-top:1px solid var(--line)}
.pf-tab{padding:14px 0;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-top:1px solid transparent;margin-top:-1px;display:flex;align-items:center;gap:6px}
.pf-tab.on{color:var(--ink);border-top:1px solid var(--ink)}
.pf-tab svg{width:15px;height:15px}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px 0 40px}
/* inbox */
.inbox{max-width:935px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;display:grid;grid-template-columns:360px 1fr;min-height:600px}
.ib-list{border-right:1px solid var(--line)}
.ib-head{padding:16px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ib-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.ib-item:hover,.ib-item.on{background:var(--soft)}
.ib-item .ava{width:48px;height:48px;flex:0 0 48px}
.ib-item b{font-size:13px;display:flex;align-items:center;gap:4px}
.ib-item p{font-size:12px;color:var(--muted)}
.ib-item .t{margin-left:auto;font-size:10px;color:var(--muted)}
.ib-thread{display:flex;flex-direction:column}
.ib-tophead{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ib-msgs{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:70%;padding:10px 14px;border-radius:18px;font-size:13px}
.msg.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--grad-cta);color:#fff;border-bottom-right-radius:5px}
.ib-prodref{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px;align-self:flex-start;max-width:75%}
.ib-prodref .mini{width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--soft)}
.ib-prodref .mini svg{width:100%;height:100%}
.ib-reply{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line)}
.ib-reply input{flex:1;height:44px;border:1px solid var(--line);border-radius:22px;padding:0 16px;outline:0}
.ib-reply input:focus{border-color:var(--brand)}
.ib-send{width:44px;height:44px;border-radius:50%;background:var(--grad-cta);color:#fff;display:grid;place-items:center}

/* ---------- store dashboard ---------- */
.dash{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;background:#f4f6f7}
.dside{position:sticky;top:0;height:100vh;background:#0c1512;color:#fff;padding:22px 14px;display:flex;flex-direction:column}
.dside .logo{color:#fff;-webkit-text-fill-color:#fff;background:none;padding:0 8px 22px}
.d-store{display:flex;align-items:center;gap:11px;padding:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px}
.d-store .ava{width:40px;height:40px;flex:0 0 40px}
.d-store b{font-size:13px}.d-store small{font-size:10px;opacity:.65;display:block}
.role{margin-left:auto;font-size:9px;background:rgba(18,184,162,.18);color:#5fe0cf;padding:4px 7px;border-radius:8px;font-weight:800}
.dside.admin{background:#1a0e12}
.dside.admin .dnav-item.on{background:#a52a3d}
.admin-role{margin-left:auto;font-size:9px;background:rgba(224,64,90,.22);color:#ff9aa9;padding:4px 7px;border-radius:8px;font-weight:800}

.today{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px;margin-bottom:14px}

.task b{font-size:11px;display:block}.task small{font-size:9.5px;color:#9eb7b1;display:block}

.quick:hover{border-color:var(--brand);transform:translateY(-1px)}.quick svg{width:20px;height:20px;color:var(--brand);margin-bottom:7px}.quick b{font-size:10.5px;display:block}.quick span{font-size:9px;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px}.section-title h2{font-size:16px}.section-title p{font-size:11px;color:var(--muted)}

.pcheck{width:16px;height:16px;accent-color:var(--brand)}.prod-actions{display:flex;gap:5px}.mini-action{height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;font-size:9.5px;font-weight:800;background:#fff}.mini-action.primary{color:var(--brand);border-color:#b8ded8}

.edit-head{display:flex;align-items:center;gap:12px;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:16px}.edit-head h2{font-size:18px}.edit-head p{font-size:10px;color:var(--muted)}.edit-head button{margin-left:auto;width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.edit-product{display:flex;align-items:center;gap:12px;padding:11px;background:#f7f9f9;border-radius:13px;margin-bottom:15px}.edit-product .tart{width:54px;height:54px}.edit-foot{position:sticky;bottom:-22px;margin:20px -22px -22px;padding:13px 22px;background:#fff;border-top:1px solid var(--line);display:flex;gap:9px}
/* campaigns */
.campaign-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:15px}.campaign-kpi{border-radius:15px;padding:15px;background:var(--surface);border:1px solid var(--line)}.campaign-kpi b{font-size:22px;display:block}.campaign-kpi span{font-size:10px;color:var(--muted)}
.campaign-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}.campaign-list{display:grid;gap:10px}
.campaign-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.campaign-top{display:flex;align-items:flex-start;gap:11px}.campaign-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e4f7f3,#fff0eb);color:var(--brand);display:grid;place-items:center;flex:none}.campaign-ic svg{width:21px;height:21px}.campaign-top h3{font-size:13px}.campaign-top p{font-size:10px;color:var(--muted);margin-top:2px}.campaign-status{margin-left:auto}
.campaign-progress{height:6px;background:var(--soft);border-radius:4px;margin:13px 0 8px;overflow:hidden}.campaign-progress i{display:block;height:100%;background:var(--grad-cta);border-radius:4px}.campaign-metrics{display:flex;gap:18px;font-size:10px;color:var(--muted)}.campaign-metrics b{color:var(--ink)}
.promo-builder{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;height:max-content;position:sticky;top:88px}.promo-builder h3{font-size:14px}.promo-builder>p{font-size:10px;color:var(--muted);margin:3px 0 14px}.promo-types{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:14px}.promo-type{padding:10px;border:1px solid var(--line);border-radius:10px;text-align:left;font-size:10px;font-weight:800}.promo-type.on{border:2px solid var(--brand);color:var(--brand);background:#effaf8}.promo-preview{margin-top:13px;border-radius:13px;padding:13px;background:linear-gradient(135deg,#10201d,#146b60);color:#fff}.promo-preview small{opacity:.7}.promo-preview b{display:block;font-size:18px;margin:4px 0}.promo-preview span{font-size:10px}
/* create */
.create{max-width:935px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.cpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.steps{display:flex;align-items:center;margin-bottom:22px}
.step{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;color:var(--muted)}
.step-n{width:26px;height:26px;border-radius:9px;background:var(--soft);display:grid;place-items:center}
.step.on{color:var(--brand)}.step.on .step-n{background:var(--grad-cta);color:#fff}
.step-l{flex:1;height:1px;background:var(--line);margin:0 8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:10px;font-weight:800;color:#586069}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:0;background:var(--surface)}

.cactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

.field-hint{font-size:10px;color:var(--muted)}

/* ---------- bell / follow ---------- */
.bell{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);background:var(--surface)}

.bell svg{width:18px;height:18px}
.post-head .bell{margin-left:auto;width:32px;height:32px}
/* ---------- reels (immersive) ---------- */
.reelswrap{position:fixed;inset:0;background:#05070a;z-index:60;display:flex;justify-content:center}

.info-btn{position:absolute;left:16px;top:104px;z-index:6;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:#0b0b0f;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}

.reel-nav{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:8}
.reel-nav button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
@media(max-width:820px){.reel-nav{display:none}.reels{max-width:100%}}
/* info overlay on feed/product image */
.media-info-btn{position:absolute;left:12px;bottom:12px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#0b0b0f;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.media-info-btn svg{width:18px;height:18px}
.media-ov{position:absolute;inset:0;background:rgba(10,12,16,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;padding:14px;z-index:4;opacity:0;pointer-events:none;transition:.2s}
.post-media.info-open .media-ov,.detail-media.info-open .media-ov{opacity:1;pointer-events:auto}
.media-ov-card{background:rgba(12,14,18,.9);color:#fff;border-radius:14px;padding:13px;width:100%}
.media-ov-card b{font-size:13px}
.media-ov-card .r{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.media-ov-card .r:last-child{border:0}.media-ov-card .r span{opacity:.7}
/* ---------- notifications ---------- */
.notif{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--soft)}
.notif .ava{width:46px;height:46px;flex:0 0 46px}
.notif-thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:0 0 46px}
.notif-thumb svg{width:100%;height:100%}
.notif b{font-weight:700}
.notif p{font-size:13px}.notif .t{font-size:11px;color:var(--muted);margin-top:2px}
.notif .act-btn{margin-left:auto;height:32px;padding:0 13px;border-radius:9px;background:var(--grad-cta);color:#fff;font-weight:800;font-size:12px}
.notif.unread{background:linear-gradient(90deg,rgba(12,155,136,.06),transparent)}
.notif-group{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:16px 4px 6px}
.ntop-bell{position:relative}
.ntop-bell .nb-dot{position:absolute;right:-1px;top:-1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);background:#0f1115;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:300;opacity:0;pointer-events:none;transition:.22s;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media(max-width:1160px){.feedwrap{grid-template-columns:minmax(0,470px);justify-content:center;gap:0}.rrail{display:none}}
@media(max-width:1024px){.detail{grid-template-columns:1fr}.detail-media{min-height:420px}.create{grid-template-columns:1fr}.preview{position:static}.inbox{grid-template-columns:300px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.dgrid,.today,.campaign-layout{grid-template-columns:1fr}.promo-builder{position:static}}
@media(max-width:820px){
  .shell,.dash{display:block}
  .rail,.dside{display:none}
  .mtop{display:flex;align-items:center;height:56px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .mtop .logo{padding:0;font-size:24px}
  .mtop-actions{margin-left:auto;display:flex;gap:16px;align-items:center}
  .mtop-actions .i{width:24px;height:24px}
  .mtop-ic{position:relative}
  .mtop-ic .dot{position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .mbottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .mbottom button{color:var(--ink);display:grid;place-items:center;min-width:48px}
  .mbottom .i{width:26px;height:26px}
  .mbottom button.on .i{stroke-width:2.6}
  .mbottom .ava{width:26px;height:26px;font-size:11px}
  .mbottom .plus{width:30px;height:30px;border-radius:9px;background:var(--grad-cta);color:#fff;display:grid;place-items:center}
  .feedwrap,.page,.profile,.inbox{padding-left:0;padding-right:0}
  .feedwrap{padding:12px 0 84px}
  .page{padding:16px 14px 84px}
  .post{border-radius:0;border-left:0;border-right:0;margin-bottom:10px}
  .post-media{aspect-ratio:auto;height:64vw;max-height:360px}
  .post-media svg.art,.slide svg.art{width:58%;height:58%}
  .mb-profile .ava{border:2px solid var(--surface)}
  .mb-profile.on .ava{box-shadow:0 0 0 2px var(--brand)}
  .stories{padding:10px 14px 16px}
  .feed-cats,.cat-row,.sub-bar{padding-left:14px;padding-right:14px}
  .explore{gap:2px}
  .profile{padding:0 0 84px}
  .pf-top{padding:18px 16px 20px;gap:20px;align-items:center}
  .pf-ava{width:88px;height:88px;flex:0 0 88px}
  .pf-ava>span{font-size:30px}
  .pf-name{gap:10px}.pf-name h1{font-size:19px}
  .pf-btns{width:100%;margin-top:4px}
  .pf-stats{justify-content:space-around;gap:0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;margin:16px 0 0}
  .pf-stats>div{flex:1}.pf-stats b{display:block}
  .pf-bio,.pf-highlights{padding-left:16px;padding-right:16px}
  .pf-tabs{gap:0;justify-content:space-around}
  .detail{border-radius:0;border-left:0;border-right:0}
  .detail-back{padding-left:14px}
  .di-actions{position:sticky;bottom:72px;background:var(--surface);padding:12px 0 0}
  .inbox{border:0;border-radius:0;display:block;min-height:auto}
  .ib-list{border-right:0}
  .ib-thread{display:none}
  .dmob-top{display:flex}
  .dcontent{padding:18px 14px 84px}
  .dtop{padding:0 14px}
  .dtop .actions .btn-line span{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .task-list{grid-template-columns:1fr}.catalog-summary{grid-template-columns:repeat(2,1fr)}.campaign-summary{grid-template-columns:1fr}.campaign-layout{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}
  .dintro{align-items:flex-start;flex-direction:column}.dintro>div:last-child{width:100%;flex-wrap:wrap}.dintro .btn{flex:1}
  .ttools{align-items:stretch}.tsearch{width:100%}.bulkbar{position:sticky;top:56px;z-index:12}
  .campaign-metrics{flex-wrap:wrap;gap:9px 16px}
  .fgrid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .mbottom.dash-mb{display:flex}
}
@media(max-width:430px){.explore{grid-template-columns:repeat(3,1fr)}.pf-grid{gap:2px}.di-title{font-size:17px}.di-price{font-size:22px}.kpi-v{font-size:19px}}

 const catsBar=`<div class="reel-cats">${cats.map(([c])=>`<button class="reel-cat ${S.reelCat===c?'on':''}" data-reelcat="${c}">${c}</button>`).join('')}</div>`;

 return `<div class="reelswrap">${catsBar}<div class="reels" id="reelScroll">${list.map((p,idx)=>{const s=sOf(p);const liked=S.liked.has(p.id),saved=S.saved.has(p.id),foll=p.store&&S.following.has(p.store),sub=p.store&&S.subscribed.has(p.store);
  return `<section class="reel" data-reel="${idx}"><div class="reel-media"><div class="slides" data-carousel>${[50,28,72].map((x,i)=>`<div class="slide ${i===0?'on':''}" style="background:radial-gradient(120% 80% at ${x}% 25%,${p.bg},#06090c)">${art(p.kind,p.color,'transparent')}</div>`).join('')}</div><div class="dots reel-dots">${[0,1,2].map(i=>`<i class="${i===0?'on':''}"></i>`).join('')}</div></div><div class="reel-shade"></div><button class="reel-tap left" data-reelslide="-1" aria-label="Oldingi rasm"></button><button class="reel-tap right" data-reelslide="1" aria-label="Keyingi rasm"></button>
  ${idx===0?`<div class="reel-top"><span class="rt-title">Tomosha</span><button class="reel-close" data-reel-close>${I('x','i')}</button></div>`:`<div class="reel-top"><span class="rt-title"></span><button class="reel-close" data-reel-close>${I('x','i')}</button></div>`}
  <div class="reel-badges"><span class="badge ${p.type}">${p.type==='store'?'Do‘kon':'Shaxsiy'}</span><span class="badge ${p.cond==='Yangi'?'success':'used'}">${p.cond}</span></div>
  <div class="info-card"><h4>${I('info','')} Mahsulot ma‘lumoti</h4><p class="info-desc">${descOf(p.id)}</p>${specRows(p.id)}<div class="info-row"><span>Mavjud</span><b>${p.stock}</b></div><div class="info-row"><span>Hudud</span><b>${p.area}</b></div></div>
  <div class="reel-rail"><button class="${liked?'liked':''}" data-rlike="${p.id}"><span class="rr-ic">${I('heart')}</span><em style="font-style:normal">${p.likes}</em></button><button data-rinfo><span class="rr-ic">${I('info')}</span>Ma‘lumot</button><button class="${saved?'saved':''}" data-rsave="${p.id}"><span class="rr-ic">${I('bookmark')}</span>Saqlash</button><button data-toast="Havola nusxalandi"><span class="rr-ic">${I('send')}</span>Ulashish</button></div>
  <div class="reel-bottom"><div class="reel-store"><div class="store-ava-wrap" data-store="${p.store||''}">${avatar(p.store||s)}${p.store?`<button class="mini-bell ${sub?'on':''}" data-bell="${p.store}" aria-label="Obuna">${I('bell')}</button>`:''}</div><b data-store="${p.store||''}">${s.title} ${vmark(s.verified)}</b>${p.store?`<button class="reel-follow ${foll?'on':''}" data-follow="${p.store}">${foll?'Kuzatilyapti':'Kuzatish'}</button>`:'<span class="reel-follow">Shaxsiy</span>'}</div><div class="reel-ttl">${p.title}</div><div class="reel-price">${p.price} so‘m</div><button class="reel-cta" data-toast="${s.title} bilan suhbat ochildi">${I('chat','i')} Bog‘lanish</button></div>
  ${idx===0?`<div class="reel-hint">${chev('up')}<span>Yuqoriga suring · boshqa do‘konlar</span></div>`:''}</section>`}).join('')}</div>
 <div class="reel-nav"><button data-reel-prev aria-label="Oldingi">${chev('up')}</button><button data-reel-next aria-label="Keyingi">${chev('down')}</button></div></div>`}
function notifsScreen(){const unread=notifs.filter(n=>n.unread).length;
 return pageShell(`<div class="page-head"><div><h1>Bildirishnomalar</h1><p>Obuna bo‘lgan do‘konlaringiz faoliyati${unread?` · ${unread} yangi`:''}</p></div>${notifs.length?'<button class="text-btn" data-mark-read>Hammasi o‘qildi</button>':''}</div>${notifs.length?`<div class="notif-group">So‘nggi</div>`+notifs.map(n=>{const s=stores[n.store];const p=pById(n.pid);return `<div class="notif ${n.unread?'unread':''}"><div class="store-ava-wrap" data-store="${n.store}">${avatar(n.store)}</div><div class="notif-thumb" data-open="${n.pid}" style="background:${p?p.bg:'#eee'}">${p?art(p.kind,p.color,p.bg):''}</div><div style="flex:1"><p><b data-store="${n.store}">${s.title}</b> ${vmark(s.verified)&&''} ${n.text}</p><div class="t">${n.time}</div></div><button class="act-btn" data-open="${n.pid}">Ko‘rish</button></div>`}).join(''):`<div class="empty"><span class="empty-ic">${I('bell')}</span><h3>Hozircha bildirishnoma yo‘q</h3><p>Do‘konlarga obuna bo‘lsangiz, yangi mahsulotlar shu yerda ko‘rinadi.</p><button class="btn btn-grad" style="flex:none;padding:0 18px;margin:14px auto 0" data-go="explore">Do‘konlarni topish</button></div>`}`,'notifs')}
function render(){const scr={feed,explore,product,profile,saved,inbox,notifs:notifsScreen,reels,dashboard,manage,inventory,promotions,leads,create,adminDash,adminMod,adminStores,adminUsers,adminReports,adminCats};
 document.getElementById('app').innerHTML=(scr[S.screen]||feed)();
 window.scrollTo(0,0);bindInputs();
 if(S.screen==='reels'){const sc=document.getElementById('reelScroll');if(sc){sc.scrollTop=S.reelStart*sc.clientHeight;}}}

 const ex=document.getElementById('exSearch');if(ex){ex.addEventListener('input',e=>{S.q=e.target.value;clearTimeout(window._t);window._t=setTimeout(render,160)})}

 const cp=document.getElementById('cPrice');if(cp)cp.addEventListener('input',e=>{S.cprice=e.target.value;const t=document.getElementById('pvPrice');if(t)t.textContent=priceText(e.target.value)});
 const ck=document.getElementById('cKw');if(ck)ck.addEventListener('input',e=>{S.ckeywords=e.target.value;const el=document.getElementById('pvKw');if(el)el.innerHTML=e.target.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6).map(x=>`<span>#${x}</span>`).join('')});
}

const storeScreens=['dashboard','manage','inventory','promotions','leads'];
const adminScreens=['adminDash','adminMod','adminStores','adminUsers','adminReports','adminCats'];
document.addEventListener('click',e=>{
 const rClose=e.target.closest('[data-reel-close]');if(rClose){S.screen=S.prevScreen||'feed';S.mode='buyer';render();return}
 const rNext=e.target.closest('[data-reel-next]');if(rNext){const sc=document.getElementById('reelScroll');if(sc)sc.scrollBy({top:sc.clientHeight,behavior:'smooth'});return}

 const rCat=e.target.closest('[data-reelcat]');if(rCat){S.reelCat=rCat.dataset.reelcat;S.reelStart=0;render();return}
 const rInfo=e.target.closest('[data-rinfo]');if(rInfo){rInfo.closest('.reel').classList.toggle('info-open');return}
 const rLike=e.target.closest('[data-rlike]');if(rLike){const id=+rLike.dataset.rlike;S.liked.has(id)?S.liked.delete(id):S.liked.add(id);rLike.classList.toggle('liked');return}
 const rSave=e.target.closest('[data-rsave]');if(rSave){const id=+rSave.dataset.rsave;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);rSave.classList.toggle('saved');toast(S.saved.has(id)?'Saqlandi':'Olib tashlandi');return}
 const iClose=e.target.closest('[data-info-close]');if(iClose){const m=iClose.closest('.post-media');if(m)m.classList.remove('info-open');return}
 const inf=e.target.closest('[data-info]');if(inf){const m=inf.closest('.post-media');if(m)m.classList.toggle('info-open');return}
 const bell=e.target.closest('[data-bell]');if(bell){const n=bell.dataset.bell;const now=!S.subscribed.has(n);now?S.subscribed.add(n):S.subscribed.delete(n);toast(now?(stores[n]?stores[n].title:'Do‘kon')+' — obuna va bildirishnoma yoqildi':'Obuna bekor qilindi');if(S.screen==='reels'){bell.classList.toggle('on',now)}else render();return}
 const rFol=e.target.closest('[data-follow]');if(rFol&&S.screen==='reels'){const n=rFol.dataset.follow;const now=!S.following.has(n);now?S.following.add(n):S.following.delete(n);rFol.classList.toggle('on',now);rFol.textContent=now?'Kuzatilyapti':'Kuzatish';toast(now?'Kuzatilyapti':'Bekor qilindi');return}
 const mRead=e.target.closest('[data-mark-read]');if(mRead){notifs.forEach(n=>n.unread=false);render();return}
 const pDemo=e.target.closest('[data-post-demo]');if(pDemo){notifs.unshift({store:'texnomart',pid:1,text:'yangi mahsulot joyladi: Galaxy Buds Pro',time:'hozir',unread:true,type:'post'});toast('Obunachilarga bildirishnoma yuborildi');render();return}
 const allSel=e.target.closest('[data-select-all]');if(allSel){const ids=[...document.querySelectorAll('[data-pselect]')].map(x=>+x.dataset.pselect);allSel.checked?ids.forEach(id=>S.selectedProducts.add(id)):ids.forEach(id=>S.selectedProducts.delete(id));render();return}
 const pSel=e.target.closest('[data-pselect]');if(pSel){const id=+pSel.dataset.pselect;S.selectedProducts.has(id)?S.selectedProducts.delete(id):S.selectedProducts.add(id);render();return}
 const clearSel=e.target.closest('[data-clear-selection]');if(clearSel){S.selectedProducts.clear();render();return}
 const editP=e.target.closest('[data-edit-product]');if(editP){S.editingProduct=+editP.dataset.editProduct;render();return}
 const closeEdit=e.target.closest('[data-close-edit]');if(closeEdit){S.editingProduct=null;render();return}
 const saveEdit=e.target.closest('[data-save-edit]');if(saveEdit){S.editingProduct=null;render();toast('O‘zgarishlar saqlandi · auditga yozildi');return}
 const duplicate=e.target.closest('[data-duplicate]');if(duplicate){toast('E‘lon nusxasi qoralama sifatida yaratildi');return}
 const bulk=e.target.closest('[data-bulk]');if(bulk){const labels={price:'Narxni ommaviy yangilash',promo:'Tanlanganlar aksiyaga qo‘shildi',pause:'Tanlangan e‘lonlar pauzaga qo‘yildi',stock:'Qoldiqni ommaviy yangilash'};toast(labels[bulk.dataset.bulk]);return}
 const promoTab=e.target.closest('[data-promo-tab]');if(promoTab){S.promoTab=promoTab.dataset.promoTab;render();return}
 const promoType=e.target.closest('[data-promo-type]');if(promoType){S.promoType=promoType.dataset.promoType;render();return}
 const focusPromo=e.target.closest('[data-focus-promo]');if(focusPromo){document.getElementById('promoBuilder')?.scrollIntoView({behavior:'smooth'});return}

 const st=e.target.closest('[data-store]');if(st&&st.dataset.store){S.storeView=st.dataset.store;S.screen='profile';S.mode='buyer';render();return}

 const fl=e.target.closest('[data-follow]');if(fl){const n=fl.dataset.follow;S.following.has(n)?S.following.delete(n):S.following.add(n);toast(S.following.has(n)?'Kuzatilyapti':'Kuzatish bekor qilindi');render();return}

 const cc=e.target.closest('[data-cat]');if(cc){S.cat=cc.dataset.cat;S.sub='';render();return}
 const sb=e.target.closest('[data-sub]');if(sb){S.sub=sb.dataset.sub;render();return}
 const pl=e.target.closest('[data-pill]');if(pl){pl.parentNode.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));pl.classList.add('on');toast('Filtr qo‘llandi');return}
 const tp=e.target.closest('[data-toast]');if(tp){toast(tp.dataset.toast);return}
});
let _tt;function toast(t){const el=document.getElementById('toast');el.innerHTML=I('check','i')+' '+t;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2200)}
// Bitta karusel slaydini yo'nalish bo'yicha almashtirish (auto va qo'lda uchun)
function slideCarousel(c,dir){const sl=[...c.querySelectorAll('.slide')];if(sl.length<2)return;let cur=sl.findIndex(s=>s.classList.contains('on'));if(cur<0)cur=0;const nx=(cur+dir+sl.length)%sl.length;sl[cur].classList.remove('on');sl[nx].classList.add('on');const dots=c.nextElementSibling;if(dots&&dots.classList.contains('dots')){[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===nx));}}
// Har 5 soniyada mahsulot rasmlari avtomatik slayd bo'ladi
setInterval(()=>{document.querySelectorAll('[data-carousel]').forEach(c=>slideCarousel(c,1));},5000);
// Shorts: rasmni qo'lda yon tomonga surib almashtirish
let _tsx=0,_tsy=0,_tReel=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];_tsx=t.clientX;_tsy=t.clientY;_tReel=e.target.closest?e.target.closest('.reel'):null;},{passive:true});
document.addEventListener('touchend',e=>{if(!_tReel)return;const t=e.changedTouches[0];const dx=t.clientX-_tsx,dy=t.clientY-_tsy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){const c=_tReel.querySelector('[data-carousel]');if(c)slideCarousel(c,dx<0?1:-1);}_tReel=null;},{passive:true});
render();
</script>
