'leads','Murojaatlar')}
    function add(){return dashShell(`<div class="dash-intro"><div><h1>Yangi mahsulot</h1><p>Ma‘lumotlarni to‘ldiring va moderatsiyaga yuboring.</p></div></div><div class="form-layout"><section class="form-panel"><div class="steps"><div class="step active"><span class="step-num">1</span>Asosiy</div><i class="step-line"></i><div class="step"><span class="step-num">2</span>Variant</div><i class="step-line"></i><div class="step"><span class="step-num">3</span>Media</div><i class="step-line"></i><div class="step"><span class="step-num">4</span>Preview</div></div><div class="field-grid"><div class="field full"><label>Mahsulot nomi *</label><input id="formTitle" value="${state.formTitle}" placeholder="Aniq va qisqa nom"></div><div class="field"><label>Kategoriya *</label><select><option>Elektronika → Telefonlar</option></select></div><div class="field"><label>Holati *</label><select><option>Yangi</option><option>Ishlatilgan</option></select></div><div class="field"><label>Narx *</label><input id="formPrice" value="${state.formPrice}"></div><div class="field"><label>O‘lchov birligi</label><select><option>dona</option></select></div><div class="field"><label>Brend *</label><input value="Samsung"></div><div class="field"><label>Model *</label><input value="Galaxy A54"></div><div class="field full"><label>Tavsif *</label><textarea>Yangi Samsung Galaxy A54. Rasmiy 12 oylik kafolat. Qutisi va barcha aksessuarlari mavjud.</textarea></div><div class="field full"><label>Mahsulot rasmlari *</label><div class="upload">${icon('upload')}<span><b>Rasm yuklash uchun bosing</b>PNG, JPG yoki WebP · 10 MB gacha</span></div></div></div><div class="form-actions"><button class="secondary" data-toast="Qoralama saqlandi">${icon('save')} Qoralama</button><button class="primary" data-toast="Keyingi bosqich: variant va SKU">Davom etish ${icon('arrow')}</button></div></section><aside class="preview-panel"><h3>Xaridor ko‘rinishida preview</h3><div class="preview-phone">${art('phone','#e8f3f2','#263a4c')}<div class="preview-copy"><div class="filter-row"><span class="chip store">Do‘kon</span><span class="chip success">Yangi</span></div><div class="price" id="previewPrice">${state.formPrice} so‘m</div><div class="product-title" id="previewTitle">${state.formTitle}</div><div class="meta">${icon('pin')} Chilonzor · TexnoMart</div></div></div><div class="notice" style="margin-top:16px">${icon('clock')}<span>Yuborilgach mahsulot <b>Tekshiruvda</b> holatiga o‘tadi. Tasdiqlanmaguncha public ko‘rinmaydi.</span></div></aside></div>`,'manage','Yangi mahsulot')}
    function render(){const screens={home,search,store,detail,saved,messages,dashboard,manage,inventory,leads,add};document.getElementById('app').innerHTML=(screens[state.screen]||home)();bindDynamic()}
    function bindDynamic(){const gs=document.getElementById('globalSearch');if(gs){gs.addEventListener('keydown',e=>{if(e.key==='Enter'){state.query=e.target.value.trim();state.screen='search';render()}})}const ss=document.getElementById('storeSearch');if(ss){ss.addEventListener('input',e=>{state.storeQuery=e.target.value;clearTimeout(window.sq);window.sq=setTimeout(render,180)})}const ft=document.getElementById('formTitle'),fp=document.getElementById('formPrice');if(ft)ft.addEventListener('input',e=>{state.formTitle=e.target.value;document.getElementById('previewTitle').textContent=e.target.value||'Mahsulot nomi'});if(fp)fp.addEventListener('input',e=>{state.formPrice=e.target.value;document.getElementById('previewPrice').textContent=(e.target.value||'0')+' so‘m'})}
    document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){state.screen=go.dataset.go;state.mode=['dashboard','manage','inventory','leads','add'].includes(state.screen)?'store':'buyer';render();return}const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;state.screen=state.mode==='store'?'dashboard':'home';render();return}const prod=e.target.closest('[data-product]');if(prod&&!e.target.closest('[data-save]')){state.screen='detail';render();return}const save=e.target.closest('[data-save]');if(save){const id=+save.dataset.save;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);showToast(state.saved.has(id)?'Mahsulot saqlandi':'Saqlanganlardan olib tashlandi');render();return}const variant=e.target.closest('[data-variant]');if(variant){state.selectedVariant=variant.dataset.variant;render();return}const status=e.target.closest('[data-status]');if(status){state.productStatus=status.dataset.status;render();return}const lead=e.target.closest('[data-lead]');if(lead){state.lead=lead.dataset.lead;render();return}const qty=e.target.closest('[data-qty]');if(qty){const el=document.getElementById('qty-'+qty.dataset.row);el.textContent=Math.max(0,+el.textContent+(+qty.dataset.qty));showToast('Qoldiq yangilandi · auditga yozildi');return}const toast=e.target.closest('[data-toast]');if(toast){showToast(toast.dataset.toast);return}const searchBtn=e.target.closest('[data-search-submit]');if(searchBtn){const input=document.getElementById('heroSearch');state.query=input.value.trim();state.screen='search';render();return}if(e.target.closest('[data-clear-search]')){state.query='';state.screen='search';render();return}const filter=e.target.closest('.filter');if(filter){filter.classList.toggle('active');showToast('Filtr yangilandi')}});
    function showToast(text){const t=document.getElementById('toast');t.innerHTML=`${icon('check')} ${text}`;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
    render();
  </script>
</body>
</html>
